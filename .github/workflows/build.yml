name: Build and Commit Scripting App

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Build Scripting App
        run: npm run build
      
      - name: Commit and push dist directory
        run: |
          git add dist/
          if (-not (git diff --cached --quiet --exit-code)) {
            git commit -m "Auto-update: Build scripts at $(Get-Date -Format o)"
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to commit generated dist files."
            }

            $pushSucceeded = $false
            $maxAttempts = 5
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              Write-Host "Pushing generated dist commit (attempt $attempt/$maxAttempts)..."
              git -c http.version=HTTP/1.1 push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:dev
              if ($LASTEXITCODE -eq 0) {
                $pushSucceeded = $true
                break
              }

              if ($attempt -lt $maxAttempts) {
                $delaySeconds = [int][Math]::Pow(2, $attempt) * 5
                Write-Warning "Push failed; retrying in $delaySeconds seconds."
                Start-Sleep -Seconds $delaySeconds
              }
            }

            if (-not $pushSucceeded) {
              throw "Unable to push generated dist commit after $maxAttempts attempts."
            }
          }
        shell: pwsh
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scripting-apps
          path: dist/*.scripting
